        	public async ensureStore(): Promise<any> {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.ensureInterviewStore) {
        			return app.ensureInterviewStore(this);
        		}
        		if (app && app.initVuApp) { app.initVuApp(); }
        		const store = (app && app.getInterviewStore)
        			? app.getInterviewStore()
        			: ((this.global && this.global.interviewStore) || null);
        		if (store && store.whenReady) { await store.whenReady(); }
        		return store;
        	}
        	public displayOrDash(v: string): string {
        		const s = (v || "").trim();
        		return s || "—";
        	}
        	public labelJourney(id: string): string {
        		const m: any = {
        			creation: "Création de l''activité",
        			vie_courante: "Vie courante",
        			imprevus: "Imprévus",
        			fin: "Fin de l''activité"
        		};
        		return m[id] || id;
        	}
        	public labelJourneyStep(id: string): string {
        		const m: any = {
        			creation_renseigne: "Je me renseigne sur le statut d''auto-entrepreneur",
        			creation_formalites: "Je réalise les formalités administratives",
        			creation_declarations: "Je fais mes premières déclarations",
        			vc_cotisations: "Je gère et paie mes cotisations",
        			vc_appel_offre: "Je réponds à un appel d''offre ou à un donneur d''ordre",
        			vc_declaration_fiscale: "Je fais ma déclaration fiscale",
        			vc_erreur_declarations: "J''ai fait une erreur lors de mes déclarations",
        			vc_mode_reglement: "Je veux changer la façon de régler mes cotisations",
        			vc_donnees_admin: "J''actualise mes données administratives",
        			imp_baisse_revenus: "Je suis confronté à une baisse de revenus",
        			imp_absence: "Je suis absent (maladie, maternité, paternité...)",
        			imp_sinistre: "Je suis victime d''un sinistre (incendie, vol, etc.)",
        			imp_controle: "J''ai un contrôle social ou fiscal",
        			imp_retard_dette: "J''ai du retard dans mes règlements (dette)",
        			fin_procedure_collective: "J''ai une procédure collective (redressement, liquidation...)",
        			fin_fermeture: "Je choisis de fermer mon auto-entreprise",
        			fin_retraite: "Je pars à la retraite"
        		};
        		return m[id] || id;
        	}
        	public labelSatisfaction(id: string): string {
        		const m: any = {
        			tres_insatisfait: "Très insatisfait",
        			moyen: "Moyen",
        			satisfait: "Satisfait",
        			tres_satisfait: "Très satisfait"
        		};
        		return m[id] || id;
        	}
        	public satisfactionEmoji(id: string): string {
        		const m: any = {
        			tres_insatisfait: "😠",
        			moyen: "😕",
        			satisfait: "🙂",
        			tres_satisfait: "😄"
        		};
        		return m[id] || "";
        	}
        	public ratingClass(id: string): string {
        		if (id === "tres_insatisfait") { return "vu-sat-pill vu-sat-sad"; }
        		if (id === "moyen") { return "vu-sat-pill vu-sat-medium"; }
        		if (id === "satisfait") { return "vu-sat-pill vu-sat-happy"; }
        		if (id === "tres_satisfait") { return "vu-sat-pill vu-sat-very-happy"; }
        		return "vu-recap-muted";
        	}
        	public hasJourneyRatings(): boolean {
        		return (this.journeyRatingRows || []).length > 0;
        	}
        	public sectorDisplay(): string {
        		const s = (this.sector || "").trim();
        		const f = (this.sectorFamily || "").trim();
        		if (s && f && f !== s) { return f + " — " + s; }
        		return s || f || "";
        	}
        	public labelContact(mode: string): string {
        		if (mode === "direct") { return "Contact direct Urssaf"; }
        		if (mode === "intermediaire") { return "Via intermédiaire"; }
        		return mode || "";
        	}
        	public statusLabel(st: string): string {
        		const m: any = {
        			draft: "Brouillon",
        			saved: "Validée",
        			synced: "Synchronisée",
        			syncing: "Synchronisation…",
        			error: "Erreur sync",
        			ready: "Prête"
        		};
        		return m[st] || st || "—";
        	}
        	public statusClass(st: string): string {
        		const s = st || "";
        		if (s === "synced") { return "vu-badge-pill vu-status-synced"; }
        		if (s === "saved") { return "vu-badge-pill vu-status-saved"; }
        		if (s === "draft") { return "vu-badge-pill vu-status-draft"; }
        		if (s === "error") { return "vu-badge-pill vu-status-error"; }
        		return "vu-badge-pill";
        	}
        	public async loadRecap(): Promise<void> {
        		const store = await this.ensureStore();
        		if (store && store._page !== this) { store._page = this; }
        		
        		const urlParams = new URLSearchParams(window.location.search);
        		let routeId = urlParams.get("interviewId");
        		if (!routeId) {
        			const route = this.getInstance(ActivatedRoute);
        			routeId = route && route.snapshot && route.snapshot.queryParamMap ? route.snapshot.queryParamMap.get("interviewId") : null;
        		}
        		this.searchId = routeId || "";
        		
        		let iv = null;
        		if (routeId) {
        			iv = store ? store.getInterview(routeId) : null;
        			if (!iv && store && store.fsGet) {
        				try {
        					const doc = await store.fsGet(this, "interview:" + routeId);
        					if (doc) {
        						iv = store.docToInterview(doc);
        					}
        				} catch (e) { /* ignore */ }
        			}
        			if (iv && store && store.setRecapView) { store.setRecapView(routeId); }
        		}
        		if (!iv) {
        			iv = store ? store.getRecapInterview() : null;
        		}
        		if (!iv && store && this.navParams && this.navParams.data && this.navParams.data.interviewId) {
        			iv = store.getInterview(this.navParams.data.interviewId);
        		}
        		if (!iv) {
        			if (store) {
        				try {
        					const allDocs: any = await this.c8o.callJsonObject("fs://" + store.FS_DB + ".allDocs", { include_docs: false });
        					console.log("[loadRecap] Fiche " + routeId + " non trouvee. Liste des documents en base :", (allDocs && allDocs.rows ? allDocs.rows.map((r: any) => r.id) : []));
        				} catch (err) {
        					console.error("[loadRecap] allDocs check failed:", err);
        				}
        			}
        			this.notFound = true;
        			return;
        		}
        		this.notFound = false;
        		this.interviewId = iv.interviewId || "";
        		this.isSalon = iv.format === "salon";
        		this.status = iv.status || "";
        		this.sheetCode = iv.sheetCode || iv.context || "";
        		let fn = (iv.firstName || "").trim();
        		const salon = (iv.salonName || "").trim();
        		const sheet = (iv.sheetCode || "").trim();
        		if (fn && (fn === salon || fn === sheet)) { fn = ""; }
        		this.firstName = fn;
        		this.intervieweeEmail = iv.intervieweeEmail || "";
        		this.dateLabel = store.formatDate(iv.updatedAt || iv.createdAt);
        		this.userTypologyLabel = store.getTypologyLabel
        			? store.getTypologyLabel(iv.userTypology)
        			: (iv.userTypology || "");
        		this.investigatorName = (iv.investigatorName || "").trim() || "Enquêteur Terrain";
        		this.investigatorPhoto = iv.investigatorPhoto || "";
        		this.journeyRatingRows = (iv.journeyRatings || []).map((r: any) => ({
        			stepLabel: store.getJourneyStepLabel
        				? store.getJourneyStepLabel(r.stepId)
        				: this.labelJourneyStep(r.stepId),
        			familyLabel: store.getJourneyFamilyLabel
        				? store.getJourneyFamilyLabel(r.family)
        				: this.labelJourney(r.family),
        			emoji: this.satisfactionEmoji(r.satisfaction),
        			satisfactionLabel: this.labelSatisfaction(r.satisfaction || ""),
        			satisfaction: r.satisfaction || ""
        		}));
        		this.verbatimText = iv.verbatimText || "";
        		this.sector = iv.sector || "";
        		this.sectorFamily = iv.sectorFamily || "";
        		this.age = iv.age || "";
        		this.urssafSince = iv.urssafSince || "";
        		if (iv.multiProfile === true) {
        			this.multiProfileText = "Oui" + ((iv.profileCount || "").trim() ? " (" + iv.profileCount + ")" : "");
        		} else if (iv.multiProfile === false) {
        			this.multiProfileText = "Non";
        		} else {
        			this.multiProfileText = "";
        		}
        		this.contactMode = this.labelContact(iv.contactMode || "");
        		this.recontactText = iv.recontactOk ? "Oui" : "Non";
        		this.photoDataUrl = iv.photoDataUrl || "";
        		this.photos = store.getSalonPhotos ? store.getSalonPhotos(iv) : [];
        		if (!this.photos.length && this.photoDataUrl) { this.photos = [this.photoDataUrl]; }
        		this.syncError = iv.syncError || "";
        	}
        	public hasPhoto(): boolean {
        		return (this.photos || []).length > 0;
        	}
        	public photoCountLabel(): string {
        		return (this.photos || []).length + " / " + this.maxPhotos;
        	}
        	public openPhotoPreview(url: string): void {
        		if (!url) { return; }
        		this.photoPreviewUrl = url;
        		this.photoPreviewOpen = true;
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public closePhotoPreview(): void {
        		this.photoPreviewOpen = false;
        		this.photoPreviewUrl = "";
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public stopPhotoPreviewBubble(ev: any): void {
        		if (ev && ev.stopPropagation) { ev.stopPropagation(); }
        	}
        	public photoBg(src: string): string {
        		const s = (src || "").trim();
        		return s ? ("url(\"" + s + "\")") : "none";
        	}
        	public hasVerbatim(): boolean {
        		return !!(this.verbatimText || "").trim();
        	}
        	public async editInterview(): Promise<void> {
        		const store = await this.ensureStore();
        		if (!store || !this.interviewId || !store.reopenValidatedForEdit) { return; }
        		if (store._page !== this) { store._page = this; }
        		const r = store.reopenValidatedForEdit(this.interviewId);
        		if (!r || !r.route) { return; }
        		await this.angularRouter.navigate([r.route]);
        	}
        	public async confirmDelete(): Promise<void> {
        		if (!this.interviewId || this.deleting) { return; }
        		const alertCtrl = this.getInstance(AlertController);
        		const alert = await alertCtrl.create({
        			header: "Supprimer la fiche",
        			message: "Supprimer définitivement cette fiche ? Cette action est irréversible.",
        			buttons: [
        				{ text: "Annuler", role: "cancel" },
        				{ text: "Supprimer", role: "destructive", handler: () => { this.doDelete(); } }
        			]
        		});
        		await alert.present();
        	}
        	public async doDelete(): Promise<void> {
        		const store = await this.ensureStore();
        		if (!store || !this.interviewId || !store.deleteInterview) { return; }
        		if (store._page !== this) { store._page = this; }
        		this.deleting = true;
        		if (this.ref) { this.ref.markForCheck(); }
        		let res: any = null;
        		try {
        			res = await store.deleteInterview(this, this.interviewId);
        		} catch (e: any) {
        			res = { localOk: false, sqlOk: false, message: "Suppression impossible : " + ((e && e.message) ? e.message : String(e)) };
        		}
        		this.deleting = false;
        		const toastCtrl = this.getInstance(ToastController);
        		const ok = !!(res && res.localOk);
        		const t = await toastCtrl.create({
        			message: ok ? "Fiche supprimée." : "Suppression impossible.",
        			duration: 3500,
        			position: "bottom",
        			color: ok ? "success" : "danger"
        		});
        		await t.present();
        		if (ok) {
        			await this.angularRouter.navigate(["/"], { replaceUrl: true });
        		} else if (this.ref) {
        			this.ref.markForCheck();
        		}
        	}
        	/*End_c8o_PageFunction*/'''
