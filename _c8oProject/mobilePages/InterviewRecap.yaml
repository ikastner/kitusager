      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public sheetCode: string = "";
        	public firstName: string = "";
        	public intervieweeEmail: string = "";
        	public status: string = "";
        	public dateLabel: string = "";
        	public journeyText: string = "";
        	public globalSatisfaction: string = "";
        	public verbatimText: string = "";
        	public sector: string = "";
        	public age: string = "";
        	public urssafSince: string = "";
        	public multiProfileText: string = "";
        	public contactMode: string = "";
        	public recontactText: string = "";
        	public photoDataUrl: string = "";
        	public photos: string[] = [];
        	public syncError: string = "";
        	public isSalon: boolean = true;
        	public notFound: boolean = false;
        	public searchId: string = "";
        	public photoPreviewUrl: string = "";
        	public photoPreviewOpen: boolean = false;
        	public maxPhotos: number = 4;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async ensureStore(): Promise<any> {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.ensureInterviewStore) {
        			return app.ensureInterviewStore(this);
        		}
        		if (app && app.initVuApp) { app.initVuApp(); }
        		const store = (app && app.getInterviewStore)
        			? app.getInterviewStore()
        			: ((this.global && this.global.interviewStore) || null);
        		if (store && store.whenReady) { await store.whenReady(); }
        		return store;
        	}
        	public displayOrDash(v: string): string {
        		const s = (v || "").trim();
        		return s || "—";
        	}
        	public labelJourney(id: string): string {
        		const m: any = {
        			creation: "Création activité",
        			vie_courante: "Vie courante",
        			imprevus: "Imprévus",
        			fin: "Fin de parcours"
        		};
        		return m[id] || id;
        	}
        	public labelSatisfaction(id: string): string {
        		const m: any = {
        			tres_insatisfait: "Très insatisfait",
        			moyen: "Moyen",
        			satisfait: "Satisfait",
        			tres_satisfait: "Très satisfait"
        		};
        		return m[id] || id;
        	}
        	public labelContact(mode: string): string {
        		if (mode === "direct") { return "Contact direct Urssaf"; }
        		if (mode === "intermediaire") { return "Via intermédiaire"; }
        		return mode || "";
        	}
        	public statusLabel(st: string): string {
        		const m: any = {
        			draft: "Brouillon",
        			saved: "Validée",
        			synced: "Synchronisée",
        			syncing: "Synchronisation…",
        			error: "Erreur sync",
        			ready: "Prête"
        		};
        		return m[st] || st || "—";
        	}
        	public statusClass(st: string): string {
        		const s = st || "";
        		if (s === "synced") { return "vu-badge-pill vu-status-synced"; }
        		if (s === "saved") { return "vu-badge-pill vu-status-saved"; }
        		if (s === "draft") { return "vu-badge-pill vu-status-draft"; }
        		if (s === "error") { return "vu-badge-pill vu-status-error"; }
        		return "vu-badge-pill";
        	}
        	public satClass(val: string): string {
        		const s = (val || "").trim().toLowerCase();
        		if (s.indexOf("insatisfait") >= 0) return "vu-sat-pill vu-sat-sad";
        		if (s.indexOf("très satisfait") >= 0) return "vu-sat-pill vu-sat-very-happy";
        		if (s.indexOf("satisfait") >= 0) return "vu-sat-pill vu-sat-happy";
        		if (s.indexOf("moyen") >= 0) return "vu-sat-pill vu-sat-medium";
        		return "vu-recap-muted";
        	}
        	public async loadRecap(): Promise<void> {
        		const store = await this.ensureStore();
        		if (store && store._page !== this) { store._page = this; }
        		
        		const urlParams = new URLSearchParams(window.location.search);
        		let routeId = urlParams.get("interviewId");
        		if (!routeId) {
        			const route = this.getInstance(ActivatedRoute);
        			routeId = route && route.snapshot && route.snapshot.queryParamMap ? route.snapshot.queryParamMap.get("interviewId") : null;
        		}
        		this.searchId = routeId || "";
        		
        		let iv = null;
        		if (routeId) {
        			iv = store ? store.getInterview(routeId) : null;
        			if (!iv && store && store.fsGet) {
        				try {
        					const doc = await store.fsGet(this, "interview:" + routeId);
        					if (doc) {
        						iv = store.docToInterview(doc);
        					}
        				} catch (e) { /* ignore */ }
        			}
        			if (iv && store && store.setRecapView) { store.setRecapView(routeId); }
        		}
        		if (!iv) {
        			iv = store ? store.getRecapInterview() : null;
        		}
        		if (!iv && store && this.navParams && this.navParams.data && this.navParams.data.interviewId) {
        			iv = store.getInterview(this.navParams.data.interviewId);
        		}
        		if (!iv) {
        			if (store) {
        				try {
        					const allDocs: any = await this.c8o.callJsonObject("fs://" + store.FS_DB + ".allDocs", { include_docs: false });
        					console.log("[loadRecap] Fiche " + routeId + " non trouvee. Liste des documents en base :", (allDocs && allDocs.rows ? allDocs.rows.map((r: any) => r.id) : []));
        				} catch (err) {
        					console.error("[loadRecap] allDocs check failed:", err);
        				}
        			}
        			this.notFound = true;
        			return;
        		}
        		this.notFound = false;
        		this.isSalon = iv.format === "salon";
        		this.status = iv.status || "";
        		this.sheetCode = iv.sheetCode || iv.context || "";
        		this.firstName = iv.firstName || iv.intervieweeName || "";
        		this.intervieweeEmail = iv.intervieweeEmail || "";
        		this.dateLabel = store.formatDate(iv.updatedAt || iv.createdAt);
        		const steps = (iv.journeySteps || []).map((id: string) => this.labelJourney(id));
        		this.journeyText = steps.length ? steps.join(", ") : "";
        		this.globalSatisfaction = this.labelSatisfaction(iv.globalSatisfaction || "");
        		this.verbatimText = iv.verbatimText || "";
        		this.sector = iv.sector || "";
        		this.age = iv.age || "";
        		this.urssafSince = iv.urssafSince || "";
        		if (iv.multiProfile === true) {
        			this.multiProfileText = "Oui" + ((iv.profileCount || "").trim() ? " (" + iv.profileCount + ")" : "");
        		} else if (iv.multiProfile === false) {
        			this.multiProfileText = "Non";
        		} else {
        			this.multiProfileText = "";
        		}
        		this.contactMode = this.labelContact(iv.contactMode || "");
        		this.recontactText = iv.recontactOk ? "Oui" : "Non";
        		this.photoDataUrl = iv.photoDataUrl || "";
        		this.photos = store.getSalonPhotos ? store.getSalonPhotos(iv) : [];
        		if (!this.photos.length && this.photoDataUrl) { this.photos = [this.photoDataUrl]; }
        		this.syncError = iv.syncError || "";
        	}
        	public hasPhoto(): boolean {
        		return (this.photos || []).length > 0;
        	}
        	public photoCountLabel(): string {
        		return (this.photos || []).length + " / " + this.maxPhotos;
        	}
        	public openPhotoPreview(url: string): void {
        		if (!url) { return; }
        		this.photoPreviewUrl = url;
        		this.photoPreviewOpen = true;
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public closePhotoPreview(): void {
        		this.photoPreviewOpen = false;
        		this.photoPreviewUrl = "";
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public stopPhotoPreviewBubble(ev: any): void {
        		if (ev && ev.stopPropagation) { ev.stopPropagation(); }
        	}
        	public hasVerbatim(): boolean {
        		return !!(this.verbatimText || "").trim();
        	}
        	/*End_c8o_PageFunction*/'''
