scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public recontactOk: boolean = false;
        	public firstName: string = "";
        	public intervieweeEmail: string = "";
        	public photos: string[] = [];
        	public maxPhotos: number = 4;
        	public validationError: string = "";
        	public photoPreviewUrl: string = "";
        	public photoPreviewOpen: boolean = false;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async ensureStore(): Promise<any> {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.ensureInterviewStore) { return app.ensureInterviewStore(this); }
        		if (app && app.initVuApp) { app.initVuApp(); }
        		return app && app.getInterviewStore ? app.getInterviewStore() : ((this.global && this.global.interviewStore) || null);
        	}
        	public async loadStep(): Promise<void> {
        		const store = await this.ensureStore();
        		if (store && store.whenReady) { await store.whenReady(); }
        		if (!store) { return; }
        		const iv = store.getActiveInterview();
        		if (!iv || iv.format !== "salon") { return; }
        		this.recontactOk = !!iv.recontactOk;
        		this.firstName = iv.firstName || "";
        		this.intervieweeEmail = iv.intervieweeEmail || "";
        		this.photos = store.getSalonPhotos ? store.getSalonPhotos(iv) : ((iv.salonPhotos || []).slice());
        		if (!this.photos.length && iv.photoDataUrl) { this.photos = [iv.photoDataUrl]; }
        		this.validationError = "";
        	}
        	public canAddPhoto(): boolean {
        		return (this.photos || []).length < this.maxPhotos;
        	}
        	public photoCountLabel(): string {
        		return (this.photos || []).length + " / " + this.maxPhotos;
        	}
        	public persistPhotos(): void {
        		const store = this.getStoreSync();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		const list = (this.photos || []).slice(0, this.maxPhotos);
        		store.updateSalonDraft({
        			salonPhotos: list,
        			photoDataUrl: list[0] || ""
        		});
        	}
        	public removePhoto(index: number): void {
        		const list = (this.photos || []).slice();
        		if (index < 0 || index >= list.length) { return; }
        		list.splice(index, 1);
        		this.photos = list;
        		this.persistPhotos();
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public removePhotoByUrl(url: string, ev?: any): void {
        		if (ev && ev.stopPropagation) { ev.stopPropagation(); }
        		const list = (this.photos || []).slice();
        		const index = list.indexOf(url);
        		if (index < 0) { return; }
        		this.removePhoto(index);
        	}
        	public openPhotoPreview(url: string, ev?: any): void {
        		if (ev && ev.stopPropagation) { ev.stopPropagation(); }
        		if (!url) { return; }
        		this.photoPreviewUrl = url;
        		this.photoPreviewOpen = true;
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public closePhotoPreview(): void {
        		this.photoPreviewOpen = false;
        		this.photoPreviewUrl = "";
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public stopPhotoPreviewBubble(ev: any): void {
        		if (ev && ev.stopPropagation) { ev.stopPropagation(); }
        	}
        	public touchDraft(): void {
        		this.saveDraft();
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public async handlePhotoCapture(out: any): Promise<void> {
        		let raw = "";
        		if (out != null && out !== undefined) {
        			if (typeof out === "string") { raw = out; }
        			else if (typeof out === "object") { raw = out.dataURI || out.dataUrl || out.href || out.path || ""; }
        		}
        		raw = (raw || "").trim();
        		if (!raw) { return; }
        		const imageUrl = raw.indexOf("data:") === 0 ? raw : "data:image/jpeg;base64," + raw;
        		if (!this.canAddPhoto()) { return; }
        		this.photos = (this.photos || []).slice();
        		this.photos.push(imageUrl);
        		this.persistPhotos();
        	}
        	public async showToast(msg: string, color: string = "success"): Promise<void> {
        		const toastCtrl = this.getInstance(ToastController);
        		const toast = await toastCtrl.create({ message: msg, duration: 3200, position: "bottom", color });
        		await toast.present();
        	}
        	public getStoreSync(): any {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.initVuApp) { app.initVuApp(); }
        		return (app && app.getInterviewStore)
        			? app.getInterviewStore()
        			: ((this.global && this.global.interviewStore) || null);
        	}
        	public commitSubmit(): void {
        		this.validationError = "";
        		const store = this.getStoreSync();
        		if (!store) {
        			this.validationError = "Store non disponible.";
        			return;
        		}
        		if (store._page !== this) { store._page = this; }
        		const iv = store.getActiveInterview();
        		if (!iv || iv.format !== "salon") {
        			this.validationError = "Aucune fiche active.";
        			return;
        		}
        		if (!(iv.sheetCode || "").trim()) {
        			this.validationError = "Le code fiche est obligatoire (étape 1).";
        			return;
        		}
        		const verbatim = ((iv.verbatimText || "").trim());
        		if (!verbatim) {
        			this.validationError = "Le verbatim est obligatoire (étape 2).";
        			return;
        		}
        		const email = (this.intervieweeEmail || "").trim();
        		if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        			this.validationError = "Adresse e-mail invalide.";
        			return;
        		}
        		store.updateSalonDraft({
        			recontactOk: !!this.recontactOk,
        			firstName: (this.firstName || "").trim(),
        			intervieweeEmail: email,
        			salonPhotos: (this.photos || []).slice(0, this.maxPhotos),
        			photoDataUrl: (this.photos[0] || ""),
        			wizardStep: 5
        		});
        		store.completeSalonInterview();
        	}
        	public commitBack(): void {
        		const store = this.getStoreSync();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		store.updateSalonDraft({
        			recontactOk: !!this.recontactOk,
        			firstName: (this.firstName || "").trim(),
        			intervieweeEmail: (this.intervieweeEmail || "").trim(),
        			salonPhotos: (this.photos || []).slice(0, this.maxPhotos),
        			photoDataUrl: (this.photos[0] || ""),
        			wizardStep: 4
        		});
        	}
        	public getFicheLabel(): string {
        		const store = this.getStoreSync();
        		const iv = store ? store.getActiveInterview() : null;
        		if (!iv || !iv.sheetCode || iv.sheetCode === "F-") { return ""; }
        		return iv.sheetCode;
        	}
        	public async confirmQuit(): Promise<void> {
        		if (this.global && this.global.confirmQuitWizard) {
        			await this.global.confirmQuitWizard(this);
        			return;
        		}
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.confirmQuitWizard) {
        			await app.confirmQuitWizard(this);
        		}
        	}
        	public saveDraft(): void {
        		const store = this.getStoreSync();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		if (!store.getActiveInterview()) { return; }
        		store.updateSalonDraft({
        			recontactOk: !!this.recontactOk,
        			firstName: (this.firstName || "").trim(),
        			intervieweeEmail: (this.intervieweeEmail || "").trim(),
        			salonPhotos: (this.photos || []).slice(0, this.maxPhotos),
        			photoDataUrl: (this.photos[0] || ""),
        			wizardStep: 5
        		});
        	}
        	public flushStep(): void {
        		this.saveDraft();
        	}
        	public prepareBack(): void {
        		this.saveDraft();
        	}
        	/*End_c8o_PageFunction*/'
