comment: Profil enquêteur — nom et photo (config tablette)
icon: person-circle
inAutoMenu: false
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public investigatorName: string = "";
        	public investigatorPhoto: string = "";
        	public fieldError: string = "";
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async ensureStore(): Promise<any> {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.ensureInterviewStore) {
        			return app.ensureInterviewStore(this);
        		}
        		if (app && app.initVuApp) { app.initVuApp(); }
        		const store = (app && app.getInterviewStore)
        			? app.getInterviewStore()
        			: ((this.global && this.global.interviewStore) || null);
        		if (store && store.whenReady) { await store.whenReady(); }
        		return store;
        	}
        	public async loadProfile(): Promise<void> {
        		const store = await this.ensureStore();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		this.investigatorName = store.getInvestigatorName();
        		this.investigatorPhoto = store.getInvestigatorPhoto();
        		this.fieldError = "";
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public async handlePhotoCapture(out: any): Promise<void> {
        		let raw = "";
        		if (out != null && out !== undefined) {
        			if (typeof out === "string") { raw = out; }
        			else if (typeof out === "object") { raw = out.dataURI || out.dataUrl || out.href || out.path || ""; }
        		}
        		raw = (raw || "").trim();
        		if (!raw) { return; }
        		const app: any = this.router && this.router.sharedObject;
        		let imageUrl = (app && app.normalizeImageDataUrl)
        			? app.normalizeImageDataUrl(raw)
        			: (raw.indexOf("data:") === 0 ? raw : ("data:image/jpeg;base64," + raw.replace(/\s+/g, "")));
        		if (app && app.compressImageDataUrl) {
        			imageUrl = await app.compressImageDataUrl(imageUrl, 400, 0.72);
        		}
        		this.investigatorPhoto = imageUrl;
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public clearPhoto(): void {
        		this.investigatorPhoto = "";
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public photoBg(src: string): string {
        		const s = (src || "").trim();
        		return s ? ("url(\"" + s + "\")") : "none";
        	}
        	public async saveProfile(): Promise<void> {
        		this.fieldError = "";
        		const store = await this.ensureStore();
        		if (!store) {
        			this.fieldError = "Store non disponible";
        			return;
        		}
        		if (store._page !== this) { store._page = this; }
        		const name = (this.investigatorName || "").trim();
        		if (!name) {
        			this.fieldError = "Indiquez le nom de l''enquêteur";
        			if (this.ref) { this.ref.markForCheck(); }
        			return;
        		}
        		if (store.setInvestigatorProfileAsync) {
        			await store.setInvestigatorProfileAsync(name, this.investigatorPhoto || "", this);
        		} else {
        			store.setInvestigatorProfile(name, this.investigatorPhoto || "");
        		}
        		this.investigatorPhoto = store.getInvestigatorPhoto();
        		if (this.global) {
        			this.global.investigatorName = store.getInvestigatorName();
        			this.global.investigatorPhoto = store.getInvestigatorPhoto();
        		}
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.global) {
        			app.global.investigatorName = store.getInvestigatorName();
        			app.global.investigatorPhoto = store.getInvestigatorPhoto();
        		}
        	}
        	/*End_c8o_PageFunction*/'
