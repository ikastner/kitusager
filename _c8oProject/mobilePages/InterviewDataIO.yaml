comment: Import / Export - JSON CSV et publication SQL
icon: cloud-upload
scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public busy: boolean = false;
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async ensureStore(): Promise<any> {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.ensureInterviewStore) {
        			return app.ensureInterviewStore(this);
        		}
        		const store = (app && app.getInterviewStore)
        			? app.getInterviewStore()
        			: ((this.global && this.global.interviewStore) || null);
        		if (store && store.whenReady) { await store.whenReady(); }
        		return store;
        	}
        	public selectedCount(): number {
        		return (this.local.items || []).filter((it: any) => it && it.checked).length;
        	}
        	public selectedIds(): string[] {
        		return (this.local.items || []).filter((it: any) => it && it.checked).map((it: any) => it.id);
        	}
        	public isOnline(): boolean {
        		try { return typeof navigator === "undefined" ? true : !!navigator.onLine; } catch (e) { return true; }
        	}
        	public canExport(): boolean {
        		return !this.busy && this.selectedCount() > 0;
        	}
        	public canPublish(): boolean {
        		return this.canExport() && this.isOnline();
        	}
        	public refreshActionFlags(): void {
        		this.local.selected = this.selectedCount();
        		this.local.online = this.isOnline();
        		this.local.canExport = this.canExport();
        		this.local.canPublish = this.canPublish();
        		try { this.ref.markForCheck(); } catch (e) { /* ignore */ }
        	}
        	public async toast(message: string, color: string = "medium", duration: number = 4500): Promise<void> {
        		const toastCtrl = this.getInstance(ToastController);
        		const t = await toastCtrl.create({ message: message, duration: duration, position: "bottom", color: color });
        		await t.present();
        	}
        	public async loadPage(): Promise<void> {
        		const store = await this.ensureStore();
        		if (!store) {
        			this.local.items = [];
        			this.local.totalValidated = 0;
        			this.local.selected = 0;
        			this.refreshActionFlags();
        			return;
        		}
        		if (store._page !== this) { store._page = this; }
        		const list = store.listForHome() || [];
        		const prev: any = {};
        		(this.local.items || []).forEach((it: any) => { if (it && it.id) { prev[it.id] = !!it.checked; } });
        		const hasPrev = Object.keys(prev).length > 0;
        		this.local.items = list.map((iv: any) => ({
        			id: iv.id || iv.interviewId,
        			checkKey: "dataIo_" + (iv.id || iv.interviewId),
        			title: iv.sheetCode || iv.intervieweeName || iv.firstName || (iv.id || iv.interviewId),
        			statusLabel: iv.validationLabel || iv.status || "Validée",
        			checked: hasPrev ? (prev[iv.id || iv.interviewId] !== false) : true
        		}));
        		this.local.totalValidated = list.length;
        		this.refreshActionFlags();
        	}
        	public toggleItem(it: any): void {
        		if (!it) { return; }
        		it.checked = !it.checked;
        		this.refreshActionFlags();
        	}
        	public onItemCheck(it: any): void {
        		if (!it) { return; }
        		this.refreshActionFlags();
        	}
        	public selectAll(on: boolean): void {
        		(this.local.items || []).forEach((it: any) => { it.checked = !!on; });
        		this.refreshActionFlags();
        	}
        	public async exportJson(): Promise<void> {
        		if (!this.canExport()) { return; }
        		const store = await this.ensureStore();
        		const ids = this.selectedIds();
        		const filename = "interviews-" + store.exportStamp() + ".json";
        		const content = store.buildExportJson(ids);
        		const res = await store.downloadTextFile(filename, content, "application/json");
        		await this.toastExportResult(ids.length, "JSON", filename, res);
        	}
        	public async exportCsv(): Promise<void> {
        		if (!this.canExport()) { return; }
        		const store = await this.ensureStore();
        		const ids = this.selectedIds();
        		const filename = "interviews-" + store.exportStamp() + ".csv";
        		const content = store.buildExportCsv(ids);
        		// text/plain : sur Android, text/csv est souvent refusé par le partage / téléchargements
        		const res = await store.downloadTextFile(filename, content, "text/plain;charset=utf-8");
        		await this.toastExportResult(ids.length, "CSV", filename, res);
        	}
        	public async toastExportResult(n: number, kind: string, filename: string, res: any): Promise<void> {
        		if (!res || !res.ok) {
        			await this.toast("Export impossible", "danger", 5000);
        			return;
        		}
        		await this.toast("Export terminé. Le fichier se trouve dans Téléchargements.", "success", 5000);
        	}
        	public pickImportFile(): void {
        		const input = document.createElement("input");
        		input.type = "file";
        		// Pas de filtre MIME strict : sur Android les .csv sont souvent grisés (text/plain / excel)
        		input.accept = "*/*";
        		input.onchange = async () => {
        			const file = input.files && input.files[0];
        			if (!file) { return; }
        			const name = (file.name || "").toLowerCase();
        			const mime = (file.type || "").toLowerCase();
        			const looksJson = name.endsWith(".json") || mime.indexOf("json") >= 0;
        			const looksCsv = name.endsWith(".csv") || mime.indexOf("csv") >= 0
        				|| mime === "text/plain" || mime.indexOf("excel") >= 0;
        			if (name && !(looksJson || looksCsv || name.endsWith(".txt"))) {
        				await this.toast("Choisissez un fichier .json ou .csv", "warning", 5000);
        				return;
        			}
        			try {
        				const text = await file.text();
        				await this.runImport(file.name || "", text);
        			} catch (e: any) {
        				await this.toast("Import impossible: " + ((e && e.message) ? e.message : String(e)), "danger", 8000);
        			}
        		};
        		input.click();
        	}
        	public async askConflict(title: string): Promise<string> {
        		const alertCtrl = this.getInstance(AlertController);
        		return new Promise(async (resolve) => {
        			const alert = await alertCtrl.create({
        				header: "Conflit",
        				message: title,
        				backdropDismiss: false,
        				buttons: [
        					{ text: "Ignorer", handler: () => resolve("skip") },
        					{ text: "Remplacer", handler: () => resolve("replace") },
        					{ text: "Ignorer tous", handler: () => resolve("skip_all") },
        					{ text: "Remplacer tous", handler: () => resolve("replace_all") }
        			]
        			});
        			await alert.present();
        		});
        	}
        	public async runImport(filename: string, text: string): Promise<void> {
        		const store = await this.ensureStore();
        		if (!store) { return; }
        		this.busy = true;
        		this.refreshActionFlags();
        		try {
        			const kind = store.detectImportKind(filename, text);
        			const parsed = kind === "json" ? store.parseImportJson(text) : store.parseImportCsv(text);
        			let inserted = 0;
        			let skipped = 0;
        			let replaced = 0;
        			let bulk: string | null = null;
        			const touchIds: string[] = [];
        			for (const iv of parsed.interviews) {
        				const exists = !!store.getInterview(iv.interviewId);
        				if (!exists) {
        					await store.importInterview(this, iv, "replace");
        					inserted++;
        					touchIds.push(iv.interviewId);
        					continue;
        				}
        				let mode = bulk;
        				if (!mode) {
        					const choice = await this.askConflict("La fiche " + (iv.sheetCode || iv.interviewId) + " existe déjà.");
        					if (choice === "skip_all") { bulk = "skip"; mode = "skip"; }
        					else if (choice === "replace_all") { bulk = "replace"; mode = "replace"; }
        					else { mode = choice; }
        				}
        				const res = await store.importInterview(this, iv, mode);
        				if (res === "skipped") { skipped++; }
        				else if (res === "replaced") { replaced++; touchIds.push(iv.interviewId); }
        			}
        			await this.loadPage();
        			(this.local.items || []).forEach((it: any) => {
        				if (touchIds.indexOf(it.id) >= 0) { it.checked = true; }
        			});
        			this.local.selected = this.selectedCount();
        			if (parsed.hadPhotos) {
        				await this.toast("Photos ignorées à l''import (MVP)", "warning", 5000);
        			}
        			await this.toast(inserted + " ajoutée(s), " + skipped + " ignorée(s), " + replaced + " remplacée(s)", "success", 6000);
        		} finally {
        			this.busy = false;
        			this.refreshActionFlags();
        		}
        	}
        	public humanizePublishError(raw: string): string {
        		const s = (raw || "").toLowerCase();
        		if (!s) {
        			return "Vérifiez que la base de données est démarrée (Docker Postgres), puis réessayez.";
        		}
        		if (/connection refused|connect timed out|could not connect|failed to connect|connection reset|network is unreachable|unreachable|connexion refus|psqlexception|jdbc|ensure.?schema|interview_ensureschema|connection to .*refus/.test(s)) {
        			return "La base de données n''est pas joignable.";
        		}
        		if (/authentication|password|permission denied|accès refusé|auth/.test(s)) {
        			return "Accès à la base refusé (identifiants ou droits). Contactez un administrateur.";
        		}
        		if (/syntax error|sql syntax/.test(s)) {
        			return "Erreur technique côté base de données. Réessayez ou contactez le support.";
        		}
        		const short = (raw || "").replace(/\s+/g, " ").trim();
        		return short.length > 160 ? short.substring(0, 157) + "…" : short;
        	}
        	public async publishSelected(): Promise<void> {
        		if (!this.canPublish()) { return; }
        		const store = await this.ensureStore();
        		if (!store) { return; }
        		this.busy = true;
        		this.refreshActionFlags();
        		try {
        			const ids = this.selectedIds();
        			const total = ids.length;
        			const res = await store.syncSelected(this, ids);
        			const detail = this.humanizePublishError(res.lastError || "");
        			if (res.failed > 0 && res.n === 0) {
        				await this.toast(
        					"Publication impossible pour les " + total + " fiche(s) sélectionnée(s). " + detail,
        					"danger",
        					14000
        				);
        			} else if (res.n > 0 && res.failed === 0) {
        				await this.toast(
        					"Publication réussie : " + res.n + " fiche(s) enregistrée(s) en base.",
        					"success",
        					5000
        				);
        			} else if (res.n > 0) {
        				await this.toast(
        					"Publication partielle : " + res.n + " OK, " + res.failed + " en échec. " + detail,
        					"warning",
        					14000
        				);
        			} else {
        				await this.toast(
        					"Aucune fiche n''a été publiée. " + detail,
        					"danger",
        					12000
        				);
        			}
        			await this.loadPage();
        		} finally {
        			this.busy = false;
        			this.refreshActionFlags();
        		}
        	}
        	/*End_c8o_PageFunction*/'
