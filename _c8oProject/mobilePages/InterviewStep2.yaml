scriptContent: 
  - xmlizable: 
    - ↑classname: com.twinsoft.convertigo.beans.common.FormatedContent
    - com.twinsoft.convertigo.beans.common.FormatedContent: 
      →: |
        '/*Begin_c8o_PageImport*/
        /*End_c8o_PageImport*/
        /*Begin_c8o_PageDeclaration*/
        	public journeyRatings: any[] = [];
        	public wizardCanProceed: boolean = false;
        	public journeyFamilies: any[] = [
        		{ id: "creation", label: "Création de l''activité", steps: [
        			{ id: "creation_renseigne", label: "Je me renseigne sur le statut d''auto-entrepreneur" },
        			{ id: "creation_formalites", label: "Je réalise les formalités administratives" },
        			{ id: "creation_declarations", label: "Je fais mes premières déclarations" }
        		]},
        		{ id: "vie_courante", label: "Vie courante", steps: [
        			{ id: "vc_cotisations", label: "Je gère et paie mes cotisations" },
        			{ id: "vc_appel_offre", label: "Je réponds à un appel d''offre ou à un donneur d''ordre" },
        			{ id: "vc_declaration_fiscale", label: "Je fais ma déclaration fiscale" },
        			{ id: "vc_erreur_declarations", label: "J''ai fait une erreur lors de mes déclarations" },
        			{ id: "vc_mode_reglement", label: "Je veux changer la façon de régler mes cotisations" },
        			{ id: "vc_donnees_admin", label: "J''actualise mes données administratives" }
        		]},
        		{ id: "imprevus", label: "Imprévus", steps: [
        			{ id: "imp_baisse_revenus", label: "Je suis confronté à une baisse de revenus" },
        			{ id: "imp_absence", label: "Je suis absent (maladie, maternité, paternité...)" },
        			{ id: "imp_sinistre", label: "Je suis victime d''un sinistre (incendie, vol, etc.)" },
        			{ id: "imp_controle", label: "J''ai un contrôle social ou fiscal" },
        			{ id: "imp_retard_dette", label: "J''ai du retard dans mes règlements (dette)" }
        		]},
        		{ id: "fin", label: "Fin de l''activité", steps: [
        			{ id: "fin_procedure_collective", label: "J''ai une procédure collective (redressement, liquidation...)" },
        			{ id: "fin_fermeture", label: "Je choisis de fermer mon auto-entreprise" },
        			{ id: "fin_retraite", label: "Je pars à la retraite" }
        		]}
        	];
        	public satisfactionLevels: any[] = [
        		{ id: "tres_insatisfait", emoji: "😠", label: "Très insatisfait" },
        		{ id: "moyen", emoji: "😕", label: "Moyen" },
        		{ id: "satisfait", emoji: "🙂", label: "Satisfait" },
        		{ id: "tres_satisfait", emoji: "😄", label: "Très satisfait" }
        	];
        	/*End_c8o_PageDeclaration*/
        /*Begin_c8o_PageConstructor*/
        		/*End_c8o_PageConstructor*/
        /*Begin_c8o_PageFunction*/
        	public async ensureStore(): Promise<any> {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.ensureInterviewStore) { return app.ensureInterviewStore(this); }
        		if (app && app.initVuApp) { app.initVuApp(); }
        		return app && app.getInterviewStore ? app.getInterviewStore() : ((this.global && this.global.interviewStore) || null);
        	}
        	public async loadStep(): Promise<void> {
        		const store = await this.ensureStore();
        		if (!store) { return; }
        		if (store.whenReady) { await store.whenReady(); }
        		const iv = store.getActiveInterview();
        		if (!iv || iv.format !== "salon") { return; }
        		this.journeyRatings = (iv.journeyRatings || []).map((r: any) => Object.assign({}, r));
        	}
        	public touchDraft(): void {
        		this.saveDraft();
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public async confirmQuit(): Promise<void> {
        		if (this.global && this.global.confirmQuitWizard) {
        			await this.global.confirmQuitWizard(this);
        			return;
        		}
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.confirmQuitWizard) {
        			await app.confirmQuitWizard(this);
        		}
        	}
        	public saveDraft(): void {
        		const store = this.getStoreSync();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		if (!store.getActiveInterview()) { return; }
        		store.updateSalonDraft({
        			journeyRatings: (this.journeyRatings || []).map((r: any) => Object.assign({}, r)),
        			wizardStep: 2
        		});
        	}
        	public flushStep(): void {
        		this.saveDraft();
        	}
        	public prepareBack(): void {
        		this.saveDraft();
        	}
        	public getRating(stepId: string): string {
        		const r = (this.journeyRatings || []).find((x: any) => x.stepId === stepId);
        		return r ? (r.satisfaction || "") : "";
        	}
        	public rateStep(stepId: string, family: string, satisfaction: string): void {
        		const list = (this.journeyRatings || []).slice();
        		const idx = list.findIndex((x: any) => x.stepId === stepId);
        		if (idx >= 0 && list[idx].satisfaction === satisfaction) {
        			list.splice(idx, 1);
        		} else if (idx >= 0) {
        			list[idx] = { stepId: stepId, family: family, satisfaction: satisfaction };
        		} else {
        			list.push({ stepId: stepId, family: family, satisfaction: satisfaction });
        		}
        		this.journeyRatings = list;
        		this.saveDraft();
        		if (this.ref) { this.ref.markForCheck(); }
        	}
        	public smileyClass(stepId: string, level: string): string {
        		const on = this.getRating(stepId) === level;
        		return "vu-smiley-btn vu-smiley-btn--" + level + (on ? " vu-smiley-btn--on" : "");
        	}
        	public getStoreSync(): any {
        		const app: any = this.router && this.router.sharedObject;
        		if (app && app.initVuApp) { app.initVuApp(); }
        		return (app && app.getInterviewStore)
        			? app.getInterviewStore()
        			: ((this.global && this.global.interviewStore) || null);
        	}
        	public commitStep3(): void {
        		this.wizardCanProceed = false;
        		const store = this.getStoreSync();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		store.updateSalonDraft({
        			journeyRatings: (this.journeyRatings || []).map((r: any) => Object.assign({}, r)),
        			wizardStep: 3
        		});
        		this.wizardCanProceed = true;
        	}
        	public commitBack(): void {
        		const store = this.getStoreSync();
        		if (!store) { return; }
        		if (store._page !== this) { store._page = this; }
        		store.updateSalonDraft({
        			journeyRatings: (this.journeyRatings || []).map((r: any) => Object.assign({}, r)),
        			wizardStep: 1
        		});
        	}
        	public getFicheLabel(): string {
        		const store = this.getStoreSync();
        		const iv = store ? store.getActiveInterview() : null;
        		if (!iv || !iv.sheetCode || iv.sheetCode === "F-") { return ""; }
        		return iv.sheetCode;
        	}
        	/*End_c8o_PageFunction*/'
